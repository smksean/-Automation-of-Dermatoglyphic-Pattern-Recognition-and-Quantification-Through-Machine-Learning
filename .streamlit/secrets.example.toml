[supabase]
url = "https://YOUR_PROJECT.supabase.co"
service_role_key = "YOUR_SERVER_SIDE_SECRET_KEY"
bucket = "fingerprint-review"
export_path = "exports/subtype_labeling_latest.csv"

[app]
backend = "supabase"
use_oidc = false
review_access_code = "USE_A_LONG_RANDOM_CODE"
allowed_reviewer_ids = ["professor-1", "adjudicator-1"]

# For stronger identity-based access, configure Streamlit OIDC, set
# app.use_oidc=true, and list allowed email addresses above. See the deployment
# guide before adding an [auth] section.
